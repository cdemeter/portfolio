name: Deploy Portfolio to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Export
        run: npm run build

      - name: Deploy to DreamHost via Rsync over SSH
        env:
          SSHPASS: ${{ secrets.DREAMHOST_PASSWORD }}
          DH_USER: ${{ secrets.DREAMHOST_USER }}
          DH_HOST: ${{ secrets.DREAMHOST_HOST }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -e rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22" ./out/ $DH_USER@$DH_HOST:/home/$DH_USER/chrisdemeter.com/portfolio/
